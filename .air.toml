# Air: live reload for development.
#
# Dev runs the *complete* app: the SPA is built, embedded into the Go binary and served
# from the same port as the API. Any change under cmd/, internal/ or web/src triggers a
# frontend rebuild + Go build, and air restarts the single binary.
root = "."
tmp_dir = ".air"

[build]
  cmd = "node scripts/dev-build.mjs"
  bin = ".air/mvs"
  full_bin = ".air/mvs --listen 0.0.0.0:6500 --data ./data"
  include_ext = ["go", "sql", "ts", "tsx", "js", "jsx", "css", "html"]
  exclude_dir = [
    "node_modules",
    "web/node_modules",
    "web/dist",
    "internal/web/dist",
    "docs",
    "deployments",
    "scripts",
    ".tools",
    ".air",
    ".git",
    "bin",
    "data",
    "testdata"
  ]
  exclude_regex = ["_test\\.go$"]
  delay = 600
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = true

[misc]
  clean_on_exit = true
