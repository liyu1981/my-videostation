name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binary:
    name: Release binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Test
        run: go test ./...

      - name: Build web UI
        run: |
          pnpm build:web
          rm -rf internal/web/dist
          mkdir -p internal/web/dist
          cp -R web/dist/. internal/web/dist/

      - name: Cross-compile static binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/liyu1981/myvideostation/internal/buildinfo.Version=${VERSION} \
            -X github.com/liyu1981/myvideostation/internal/buildinfo.Commit=${COMMIT} \
            -X github.com/liyu1981/myvideostation/internal/buildinfo.Date=${BUILD_DATE}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            ext=""
            [ "$GOOS" = "windows" ] && ext=".exe"
            out="dist/mvs_${VERSION}_${GOOS}_${GOARCH}${ext}"
            echo "→ ${out}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -tags embedui -trimpath -ldflags "${LDFLAGS}" -o "${out}" ./cmd/mvs
          done

      - name: Smoke test linux/amd64
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ./dist/mvs_${VERSION}_linux_amd64 --listen 127.0.0.1:6500 --data /tmp/mvs-release &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:6500/api/v1/health && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:6500/ | grep -q '<div id="root">'

      - name: Package archives
        run: |
          set -euo pipefail
          cp README.md dist/README.md
          cd dist
          for f in mvs_*; do
            case "$f" in
              *.exe) zip "${f%.exe}.zip" "$f" README.md ;;
              *.tar.gz|*.zip) ;;
              *) tar -czf "${f}.tar.gz" "$f" README.md ;;
            esac
          done
          for f in mvs_*; do
            case "$f" in
              *.tar.gz|*.zip) ;;
              *) rm -f "$f" ;;
            esac
          done
          sha256sum *.tar.gz *.zip > checksums.txt
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: mvs-release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7

  docker:
    name: Docker image (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: image
        name: Image name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: version
        name: Version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - id: date
        name: Build date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=MyVideoStation
            org.opencontainers.image.description=Self-hosted media library (single binary + embedded SPA)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [binary, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mvs-release
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MyVideoStation ${{ github.ref_name }}
          generate_release_notes: true
          append_body: |
            **Docker image:** `${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.version }}` (linux/amd64, linux/arm64)
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
