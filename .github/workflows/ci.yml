name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (test, vet, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l ./cmd ./internal)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:web

  binary:
    name: Single binary build
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Smoke test the binary
        run: |
          ./bin/mvs --listen 127.0.0.1:8099 --data /tmp/mvs-ci &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8099/api/v1/health && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8099/ | grep -q '<div id="root">'
      - uses: actions/upload-artifact@v4
        with:
          name: mvs-linux-amd64
          path: bin/mvs
          retention-days: 7
